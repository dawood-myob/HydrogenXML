name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test HydrogenXML.sln -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+.*)$') { $ver = $Matches[1] } else { $ver = '0.0.0-dev' }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable zip
        shell: pwsh
        run: ./build-installer.ps1 -Version "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: HydrogenXML-${{ steps.v.outputs.version }}
          path: artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
